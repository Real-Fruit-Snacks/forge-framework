[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "0.5.0"
description = "Forge — personal Metasploit-style CTF/pentest framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
forge = "forge:main"

[tool.setuptools]
packages = ["core"]
py-modules = ["forge"]

# bundled modules/ and labs/ are installed as data via setup.py
# (setuptools data-files doesn't expand recursive globs)
