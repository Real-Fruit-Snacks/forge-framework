services:
  ad:
    build: .
    # CAP_SYS_ADMIN: samba provision + NT ACLs set security.NTACL xattrs,
    # which docker's default capability set blocks (NT_STATUS_ACCESS_DENIED).
    cap_add:
      - SYS_ADMIN
    ports:
      # impacket speaks AD ports only (389/88/445), so bind them 1:1 on
      # loopback — docker (root) can take the low ports.
      - "127.0.0.1:135:135"     # RPC endpoint mapper (DRSUAPI/DCSync)
      - "127.0.0.1:389:389"
      - "127.0.0.1:88:88"
      - "127.0.0.1:88:88/udp"   # Kerberos is UDP-first
      - "127.0.0.1:445:445"
      # pinned dynamic RPC range (see entrypoint.sh) — core.lab's port
      # parser reads single ports only; this line is for docker, not it
      - "127.0.0.1:49152-49160:49152-49160"
    volumes:
      # provisioned domain state — second boots skip the ~60s provision
      # (fixture/entrypoint edits need `lab purge ad` to take effect)
      - ad-state:/var/lib/samba

volumes:
  ad-state:
