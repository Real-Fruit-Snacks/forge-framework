# Framework SMB lab config.
# Deliberately permissive: guest access on [public], no signing — so modules
# can practice both anonymous and authenticated SMB enumeration.
[global]
   workgroup = WORKGROUP
   server string = Framework Lab Samba
   security = user
   map to guest = Bad User
   server signing = disabled
   smb encrypt = disabled
   log level = 1

[public]
   comment = Guest-readable share
   path = /shares/public
   read only = yes
   guest ok = yes

[labuser]
   comment = Authenticated share
   path = /shares/labuser
   read only = no
   valid users = labuser
